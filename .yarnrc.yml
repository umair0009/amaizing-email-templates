approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 10080

npmPreapprovedPackages:
  - "@amaizing-inc/*"

npmRegistries:
  "https://npm.pkg.github.com":
    npmAlwaysAuth: true
    npmAuthToken: "${AMAIZING_GITHUB_TOKEN}"
  "https://registry.npmjs.org":
    npmAlwaysAuth: false

npmScopes:
  amaizing-inc:
    npmRegistryServer: "https://npm.pkg.github.com"

packageExtensions:
  "@amaizing-inc/apis-common@*":
    peerDependenciesMeta:
      "@tanstack/react-query":
        optional: true
      "@tanstack/svelte-query":
        optional: true
      immer:
        optional: true
      jotai:
        optional: true
      jotai-immer:
        optional: true
      jotai-tanstack-query:
        optional: true
      svelte:
        optional: true
      react:
        optional: true
  "@amaizing-inc/apis-postmark@*":
    peerDependenciesMeta:
      "@tanstack/react-query":
        optional: true
      "@tanstack/svelte-query":
        optional: true
      immer:
        optional: true
      jotai:
        optional: true
      jotai-immer:
        optional: true
      jotai-tanstack-query:
        optional: true
      svelte:
        optional: true
      react:
        optional: true
